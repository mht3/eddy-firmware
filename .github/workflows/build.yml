name: Build Eddy
on:
  pull_request:
  push:
    branches: [dev, main]
    tags: ['eddy-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check radio restrictions, remote storage and personal Spotify setup
        run: |
          python3 -m venv "$RUNNER_TEMP/spotify-setup"
          "$RUNNER_TEMP/spotify-setup/bin/pip" install segno==1.6.6
          "$RUNNER_TEMP/spotify-setup/bin/python" -m unittest discover -s scripts/tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the app picker and device previews
        run: node --test scripts/tests/test_*.mjs
      - name: Fetch pinned firmware dependencies
        run: git submodule update --init --jobs 8 -- assets/protobuf lib
      - name: Configure the Spotify companion for this deployment
        if: github.event_name != 'pull_request' && vars.EDDY_SPOTIFY_CLIENT_ID != ''
        env:
          CLIENT_ID: ${{ vars.EDDY_SPOTIFY_CLIENT_ID }}
          SPOTIFY_SITE: ${{ vars.EDDY_SPOTIFY_SITE }}
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          pages_host="${GITHUB_REPOSITORY_OWNER,,}.github.io"
          pages_base="https://$pages_host"
          if [[ "${repo_name,,}" != "$pages_host" ]]; then pages_base+="/$repo_name"; fi
          "$RUNNER_TEMP/spotify-setup/bin/python" scripts/setup_spotify.py --site "${SPOTIFY_SITE:-$pages_base/spotify/}" --client-id "$CLIENT_ID"
          echo "DIST_SUFFIX=eddy-personal-${GITHUB_SHA:0:8}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Build the F7 main package
        run: FBT_NO_SYNC=1 ./fbt STRICT_FAP_IMPORT_CHECK=1 updater_package
      - name: Prepare website with matching firmware
        run: python3 scripts/eddy_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: eddy-f7-update
          path: dist/eddy-site/firmware/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/eddy-')
        with:
          path: dist/eddy-site

  publish:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/eddy-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: eddy-pages
      cancel-in-progress: false
    steps:
      - name: Deploy website and matching main build
        id: deploy
        uses: actions/deploy-pages@v4
