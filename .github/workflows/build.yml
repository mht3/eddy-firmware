name: Build Eddy
on:
  pull_request:
  push:
    branches: [dev, main]
    tags: ['eddy-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned firmware dependencies
        run: git submodule update --init --jobs 8 -- assets/protobuf lib
      - name: Build the F7 main package
        run: FBT_NO_SYNC=1 ./fbt updater_package
      - name: Prepare website with matching firmware
        run: python3 scripts/eddy_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: eddy-f7-update
          path: dist/eddy-site/firmware/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: eddy-website
          path: dist/eddy-site/
          if-no-files-found: error
