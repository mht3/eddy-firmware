name: Check Eddy for iPhone
on:
  push:
    branches: [dev, main]
    paths: ['ios/**', 'LICENSE', 'applications/main/eddy_spotify/source', '.github/workflows/iphone.yml']
  pull_request:
    paths: ['ios/**', 'LICENSE', 'applications/main/eddy_spotify/source', '.github/workflows/iphone.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true

permissions:
  contents: read

jobs:
  iphone:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Fetch the shared Spotify demo
        run: git submodule update --init -- applications/main/eddy_spotify/source
      - name: Build the iPhone app without a signing identity
        run: |
          xcodebuild -project ios/Eddy.xcodeproj -scheme Eddy -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/eddy-build" \
            CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/eddy-build/Build/Products/Release-iphonesimulator/Eddy.app"
          test -s "$app/demo/index.html"
          test -s "$app/demo/CREDITS.txt"
          diff -r applications/main/eddy_spotify/source/demo "$app/demo"
          cmp LICENSE "$app/LICENSE"
          cmp applications/main/eddy_spotify/source/LICENSE "$app/LICENSE"
          cmp "$RUNNER_TEMP/eddy-build/SourcePackages/checkouts/ios-auth/LICENSE" "$app/SpotifyLogin-LICENSE.txt"
      - name: Test Spotify authorization, requests and Flipper messages
        run: |
          swiftc ios/Eddy/SpotifyAccount.swift ios/Tests/SpotifyAccountTests.swift -o "$RUNNER_TEMP/eddy-account-tests"
          "$RUNNER_TEMP/eddy-account-tests"
          swiftc ios/Eddy/LibraryBridge.swift ios/Tests/LibraryBridgeTests.swift -o "$RUNNER_TEMP/eddy-bridge-tests"
          "$RUNNER_TEMP/eddy-bridge-tests"
          swiftc ios/Eddy/LibraryBridge.swift ios/Eddy/SpotifyLibrary.swift ios/Tests/SpotifyLibraryTests.swift -o "$RUNNER_TEMP/eddy-library-tests"
          "$RUNNER_TEMP/eddy-library-tests"
          swiftc ios/Eddy/Diagnostics.swift ios/Tests/DiagnosticsTests.swift -o "$RUNNER_TEMP/eddy-diagnostics-tests"
          "$RUNNER_TEMP/eddy-diagnostics-tests"
          swiftc ios/Eddy/FlipperConnection.swift ios/Tests/FlipperConnectionTests.swift -o "$RUNNER_TEMP/eddy-connection-tests"
          "$RUNNER_TEMP/eddy-connection-tests"
