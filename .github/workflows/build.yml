name: Build Eddy
on:
  pull_request:
  push:
    branches: [dev, main]
    tags: ['eddy-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check radio restrictions, remote storage and the Spotify device interface
        run: python3 -m unittest discover -s scripts/tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the app picker and device previews
        run: node --test scripts/tests/test_*.mjs
      - name: Fetch pinned firmware dependencies
        run: git submodule update --init --jobs 8 -- assets/protobuf lib
      - name: Build the F7 main package
        run: FBT_NO_SYNC=1 ./fbt STRICT_FAP_IMPORT_CHECK=1 updater_package
      - name: Build optional community apps with the matching Eddy SDK
        run: python3 scripts/build_community_apps.py
      - name: Prepare website with matching firmware
        env:
          EDDY_TESTFLIGHT_URL: ${{ vars.EDDY_TESTFLIGHT_URL }}
        run: |
          python3 scripts/eddy_site.py
          python3 scripts/stage_flipper_lab.py dist/eddy-site/firmware/main.json
      - uses: actions/upload-artifact@v4
        with:
          name: eddy-f7-update
          path: dist/eddy-site/firmware/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/eddy-')
        with:
          path: dist/eddy-site

  publish:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/eddy-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: eddy-pages
      cancel-in-progress: false
    steps:
      - name: Deploy website and matching main build
        id: deploy
        uses: actions/deploy-pages@v4
